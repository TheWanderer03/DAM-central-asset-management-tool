services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
      POSTGRES_DB: dam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: dam-minio-local:dev
    build: ./docker/minio
    pull_policy: build
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dam-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dam-minio-local-password}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio-init:
    image: dam-minio-local:dev
    build: ./docker/minio
    pull_policy: build
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/$${CLOUD_BUCKET_NAME} &&
        mc anonymous set download local/$${CLOUD_BUCKET_NAME}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dam-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dam-minio-local-password}
      CLOUD_BUCKET_NAME: ${CLOUD_BUCKET_NAME:-dam-assets}
volumes:
  pgdata:
  miniodata:
  