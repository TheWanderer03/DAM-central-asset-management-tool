
{% extends "base.html" %}

{% block title %}Assets | AssetVault{% endblock %}
{% block breadcrumb %}Assets{% endblock %}

{% block content %}

<div class="page-heading">
    <div>
        <h1>Assets</h1>
        <p>Browse, search, and manage your digital assets.</p>
    </div>
</div>

<div class="panel">
    <div class="panel-heading">
        <h2>All Assets</h2>
        <span id="asset-count">Loading...</span>
    </div>

    <div style="padding: 20px;">
        <input
            id="asset-search"
            type="search"
            placeholder="Search assets by name..."
            aria-label="Search assets"
            style="width: 100%; max-width: 450px; padding: 12px 14px; border: 1px solid #dfe3ed; border-radius: 9px; font-size: 14px;"
        >
    </div>

    <table class="asset-table">
        <thead>
            <tr>
                <th>Asset</th>
                <th>Type</th>
                <th>Tags</th>
                <th>Asset ID</th>
            </tr>
        </thead>

        <tbody id="asset-list">
            <tr>
                <td colspan="4">Loading assets...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const assetList = document.getElementById("asset-list");
    const assetCount = document.getElementById("asset-count");
    const searchInput = document.getElementById("asset-search");

    let searchTimeout;

    async function loadAssets(search = "") {
        assetList.replaceChildren();

        const loadingRow = document.createElement("tr");
        const loadingCell = document.createElement("td");

        loadingCell.colSpan = 4;
        loadingCell.textContent = "Loading assets...";

        loadingRow.appendChild(loadingCell);
        assetList.appendChild(loadingRow);

        try {
            const params = new URLSearchParams();

            if (search.trim()) {
                params.set("q", search.trim());
            }

            const response = await fetch(
                "/api/assets?" + params.toString(),
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );

            if (response.status === 401 || response.status === 403) {
                window.location.href = "/login";
                return;
            }

            if (!response.ok) {
                throw new Error("Failed to fetch assets.");
            }

            const assets = await response.json();

            renderAssets(assets);

        } catch (error) {
            console.error("Assets page error:", error);

            assetCount.textContent = "Error";

            assetList.replaceChildren();

            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 4;
            cell.textContent =
                "Could not load assets. Please refresh and try again.";

            row.appendChild(cell);
            assetList.appendChild(row);
        }
    }


function renderAssets(assets) {
    assetCount.textContent =
        assets.length + (assets.length === 1 ? " asset" : " assets");

    assetList.replaceChildren();

    if (assets.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 4;
        cell.textContent = "No matching assets found.";

        row.appendChild(cell);
        assetList.appendChild(row);
        return;
    }

    assets.forEach(asset => {
        const row = document.createElement("tr");

        // Asset name with a clickable link
        const nameCell = document.createElement("td");
        const assetLink = document.createElement("a");

        assetLink.href = `/assets/${encodeURIComponent(asset.id)}`;
        assetLink.textContent = asset.name || "Untitled";
        assetLink.style.color = "#6655ee";

        nameCell.appendChild(assetLink);

        // Asset type
        const typeCell = document.createElement("td");
        typeCell.textContent = asset.type || "Unknown";

        // Asset tags
        const tagsCell = document.createElement("td");
        tagsCell.textContent = Array.isArray(asset.tags)
            ? asset.tags.join(", ")
            : "";

        // Asset ID
        const idCell = document.createElement("td");
        idCell.textContent = asset.id;

        row.append(
            nameCell,
            typeCell,
            tagsCell,
            idCell
        );

        assetList.appendChild(row);
    });
}


    searchInput.addEventListener("input", function () {
        clearTimeout(searchTimeout);

        searchTimeout = setTimeout(function () {
            loadAssets(searchInput.value);
        }, 250);
    });

    loadAssets();
</script>

{% endblock %}
